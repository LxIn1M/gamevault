{% extends "core/base.html" %}

{% block title %}Edit {{ entry.game.title }} — LixDex{% endblock %}

{% block content %}

<div class="form-page edit-card">

    <div class="edit-entry-header">
        <span class="eyebrow">Library entry</span>

        <h1>Edit game</h1>

        <p>
            Editing
            <span class="edit-game-name">
                {{ entry.game.title }}
            </span>
        </p>
    </div>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="edit-actions">
            <a
                href="{% url 'home' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save changes
            </button>
        </div>
    </form>

</div>

{% endblock %}
