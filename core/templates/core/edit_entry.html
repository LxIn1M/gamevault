<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Entry - GameVault</title>
</head>

<body>
    <h1>{{ entry.game.title }}</h1>

{% if entry.game.background_image %}
    <img
        src="{{ entry.game.background_image }}"
        alt="{{ entry.game.title }}"
        width="300"
    >
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save</button>
</form>

<a href="{% url 'home' %}">Back to library</a>
</body>
</html>
