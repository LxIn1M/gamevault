{% extends "core/base.html" %}

{% block title %}
Edit {{ entry.game.title }} - LixDex
{% endblock %}

{% block content %}

    <div class="form-page">
        <div class="form-card">

            {% if entry.game.background_image %}
                <img
                    src="{{ entry.game.background_image }}"
                    alt="{{ entry.game.title }}"
                    class="form-cover"
                >
            {% endif %}

            <h1>{{ entry.game.title }}</h1>
            <p>Edit your library information.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="primary-button">
                    Save changes
                </button>
            </form>

            <a href="{% url 'home' %}" class="back-link">
                ← Back to library
            </a>

        </div>
    </div>

{% endblock %}
