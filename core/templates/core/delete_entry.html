{% extends "core/base.html" %}

{% block title %}
Delete Entry - LixDex
{% endblock %}

{% block content %}
    <h1>Delete {{ entry.game.title }}</h1>

    <p>
    Are you sure you want to remove
    <strong>{{ entry.game.title }}</strong>
    from your library?
</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>

    <a href="{% url 'home' %}">Cancel</a>

{% endblock %}
