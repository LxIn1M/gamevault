{% extends "core/base.html" %}

{% block title %}Delete {{ entry.game.title }} — LixDex{% endblock %}

{% block content %}

<div class="delete-card">

    <div class="delete-warning-icon">
        !
    </div>

    <span class="eyebrow">
        Remove from library
    </span>

    <h1>Delete game?</h1>

    <p>
        Are you sure you want to remove

        <span class="delete-game-name">
            {{ entry.game.title }}
        </span>

        from your library?
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="delete-actions">

            <a
                href="{% url 'home' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-danger"
            >
                Delete game
            </button>

        </div>
    </form>

</div>

{% endblock %}
