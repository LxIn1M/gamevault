<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Entry - GameVault</title>
</head>

<body>
    <h1>Delete {{ entry.game.title }}</h1>

    <p>Are you sure you want to remove this game from your library?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>

    <a href="{% url 'home' %}">Cancel</a>
</body>
</html>
