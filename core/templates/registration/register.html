{% extends "core/base.html" %}

{% block title %}
Register - LixDex
{% endblock %}

{% block content %}

    <div class="auth-page">
        <div class="auth-card">

            <h1>Create account</h1>
            <p>Start building your gaming library.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="primary-button">
                    Register
                </button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

        </div>
    </div>

{% endblock %}
