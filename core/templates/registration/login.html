{% extends "core/base.html" %}

{% block title %}
Login - LixDex
{% endblock %}

{% block content %}

    <div class="auth-page">
        <div class="auth-card">

            <h1>Welcome back</h1>
            <p>Log in to your LixDex account.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="primary-button">
                    Login
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="{% url 'register' %}">Register</a>
            </p>

        </div>
    </div>

{% endblock %}
