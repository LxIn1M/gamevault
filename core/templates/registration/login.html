{% extends "core/base.html" %}

{% block title %}Login - LixDex{% endblock %}

{% block content %}
<div class="auth-page wrap">
    <div class="auth-card">
        <span class="eyebrow-tag">Welcome back</span>
        <h1>Log in to LixDex</h1>
        <p class="muted">Continue building and tracking your gaming library.</p>

        <form method="post" class="stack-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary form-submit">Login</button>
        </form>

        <p class="auth-switch">No account yet? <a href="{% url 'register' %}">Create one</a></p>
    </div>
</div>
{% endblock %}
